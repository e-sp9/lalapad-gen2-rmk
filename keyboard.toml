[keyboard]
name = "LaLaPad Gen2 RMK"
product_name = "LaLaPad Gen2 RMK"
vendor_id = 0x4c4b
product_id = 0x4c32
manufacturer = "ShiniNet"
serial_number = "vial:f64c2b3c:000001"
chip = "nrf52840"

[layout]
