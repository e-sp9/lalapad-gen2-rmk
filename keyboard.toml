    ],
    [
        ["SHIFTED(Kc1)",  "SHIFTED(Kc2)", "SHIFTED(Kc3)", "SHIFTED(Kc4)",        "SHIFTED(Kc5)",        "No", "No", "Minus",    "Home",      "Up",        "End",    "PrintScreen"],
        ["SHIFTED(Kc6)",  "SHIFTED(Kc7)", "SHIFTED(Kc8)", "SHIFTED(Kc9)",        "SHIFTED(Kc0)",        "No", "No", "WM(Equal, LShift)", "Left",      "Down",      "Right",  "ScrollLock"],
        ["Grave",         "Quote",        "Semicolon",    "LeftBracket",         "RightBracket",        "No", "No", "_",        "MouseBtn4", "_",         "MouseBtn5", "Pause"],
        ["_",             "_",            "_",            "_",                   "_",                   "_",  "_",  "_",        "_",         "_",         "_",      "_"],
        ["No",            "_",            "_",            "_",                   "_",                   "_",  "_",  "_",        "_",         "_",         "_",      "No"],
        ["_",             "_",            "_",            "No",                  "No",                  "No", "No", "No",       "No",        "_",         "_",      "_"],
