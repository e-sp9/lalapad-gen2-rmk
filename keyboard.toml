rows = 7
cols = 12
layers = 5
keymap = [
    [
        ["Q",              "W",     "E",     "R",        "T",     "No",     "No",        "Y",     "U",        "I",         "O",         "P"],
        ["A",              "S",     "D",     "F",        "G",     "No",     "No",        "H",     "J",        "K",         "L",         "TH(Minus, Equal)"],
        ["MT(Z, LShift)",  "X",     "C",     "V",        "B",     "No",     "No",        "N",     "M",        "Comma",     "Dot",       "Slash"],
        ["LCtrl",          "LGui",  "LAlt",  "LCtrl",    "LT(2, Space, FAST_LAYER)", "LShift", "Backspace", "LT(3, Enter, FAST_LAYER)", "WM(M, LAlt)", "Language2", "Language1", "Backslash"],
        ["No",             "No",    "Right", "Down",     "Left",  "Up",     "Up",        "Left",  "Down",     "Right",     "No",        "No"],
        ["MouseBtn1",      "MouseBtn2", "MouseBtn3", "No", "No", "No", "No", "No", "No", "MouseBtn1", "MouseBtn2", "MouseBtn3"],
        ["MouseBtn4",      "MouseBtn5", "WM(Tab, LGui)", "WM(D, LGui)", "LCtrl", "No", "No", "MouseBtn4", "MouseBtn5", "WM(Tab, LGui)", "WM(D, LGui)", "LCtrl"],
    ],
    [
        ["Q",              "W",     "E",     "R",        "T",     "No",     "No",        "Y",     "U",        "I",         "O",         "P"],
        ["A",              "S",     "D",     "F",        "G",     "No",     "No",        "H",     "J",        "K",         "L",         "TH(Minus, Equal)"],
        ["MT(Z, LShift)",  "X",     "C",     "V",        "B",     "No",     "No",        "N",     "M",        "Comma",     "Dot",       "Slash"],
        ["LGui",           "LGui",  "LAlt",  "LGui",     "LT(2, Space, FAST_LAYER)", "LShift", "Backspace", "LT(3, Enter, FAST_LAYER)", "WM(M, LAlt)", "Language2", "Language1", "Backslash"],
        ["No",             "No",    "Right", "Down",     "Left",  "Up",     "Up",        "Left",  "Down",     "Right",     "No",        "No"],
        ["MouseBtn1",      "MouseBtn2", "MouseBtn3", "No", "No", "No", "No", "No", "No", "MouseBtn1", "MouseBtn2", "MouseBtn3"],
        ["MouseBtn4",      "MouseBtn5", "WM(Tab, LGui)", "WM(D, LGui)", "LGui", "No", "No", "MouseBtn4", "MouseBtn5", "WM(Tab, LGui)", "WM(D, LGui)", "LGui"],
    ],
    [
        ["Kc1",                 "Kc2",                "Kc3",  "Kc4",  "Kc5",  "No",    "No",     "_",                    "_",         "_",      "_",        "_"],
        ["Kc6",                 "Kc7",                "Kc8",  "Kc9",  "Kc0",  "No",    "No",     "_",                    "_",         "_",      "_",        "_"],
        ["F6",                  "F7",                 "F8",   "F9",   "F10",  "No",    "No",     "_",                    "_",         "_",      "_",        "_"],
        ["_",                   "_",                  "_",    "_",    "_",    "_",     "Delete", "_",                    "_",         "_",      "_",        "_"],
        ["No",                  "_",                  "_",    "_",    "_",    "_",     "_",      "_",                    "_",         "_",      "_",        "No"],
        ["_",                   "_",                  "_",    "No",   "No",   "No",    "No",     "No",                   "No",        "_",      "_",        "_"],
