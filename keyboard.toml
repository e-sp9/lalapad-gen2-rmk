    [
        ["F1",   "F2",   "F3",   "F4",   "F5",   "No", "No", "User7",      "User0",      "User1",      "User2",      "User3"],
        ["F6",   "F7",   "F8",   "F9",   "F10",  "No", "No", "Reboot",     "Bootloader",  "User6",      "DF(0)",      "DF(1)"],
        ["F11",  "F12",  "F13",  "F14",  "F15",  "No", "No", "User9",      "User10",     "User11",     "User12",     "User13"],
        ["_",    "_",    "_",    "_",    "_",    "_",  "_",  "_",          "_",           "_",          "_",          "ClearEeprom"],
        ["No",   "_",    "_",    "_",    "_",    "_",  "_",  "_",          "_",           "_",          "_",          "No"],
        ["_",    "_",    "_",    "No",   "No",   "No", "No", "No",         "No",          "_",          "_",          "_"],
        ["_",    "_",    "_",    "_",    "_",    "No", "No", "_",          "_",           "_",          "_",          "_"],
    ],
]

[storage]
start_addr = 0x000E0000
num_sectors = 8

[ble]
enabled = true
default_tx_power = 8

[ble.charge_state]
pin = "P0_17"
low_active = true

[ble.charge_led]
pin = "P0_10"
low_active = true

[behavior.tri_layer]
upper = 2
lower = 3
adjust = 4

[behavior.fork]
forks = [
  { trigger = "Semicolon", negative_output = "WM(Semicolon, LShift)", positive_output = "Semicolon", match_any = "LShift|RShift" },
]

[behavior.morse]
hold_timeout = "120ms"
permissive_hold = true
hold_on_other_press = true

[behavior.morse.profiles]
FAST_LAYER = { hold_on_other_press = true, unilateral_tap = false, hold_timeout = "120ms", gap_timeout = "120ms" }

[behavior.combo]
timeout = "150ms"
combos = [
  { actions = ["Q", "W"], output = "Escape" },
  { actions = ["A", "S"], output = "Tab" },
  { actions = ["F", "D"], output = "Language2" },
  { actions = ["J", "K"], output = "Language1" },
]

[host]
unlock_keys = [[0, 0], [0, 1]]

[split]
connection = "ble"

# Right half. This follows the upstream ZMK config where the right side is central.
[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 6

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P1_01"]
col_pins = ["P0_02", "P0_03", "P0_28", "P0_29", "P0_15", "P0_19"]

# Left half.
[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P1_01"]
col_pins = ["P0_19", "P0_15", "P0_29", "P0_28", "P0_03", "P0_02"]

[rmk]
split_peripherals_num = 1
combo_max_num = 4
combo_max_length = 2
ble_profiles_num = 4
debounce_time = 8
event_channel_size = 64
controller_channel_size = 64
report_channel_size = 64
