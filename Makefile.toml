[tasks.firmware-dirs]
command = "mkdir"
args = ["-p", "firmware/normal", "firmware/reset", "firmware/hex"]

[tasks.objcopy-central]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "central",
    "--",
    "-O",
    "ihex",
    "firmware/hex/lalapad-gen2-rmk-central.hex",
]
dependencies = ["firmware-dirs", "build"]

[tasks.objcopy-peripheral]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "peripheral",
    "--",
    "-O",
    "ihex",
    "firmware/hex/lalapad-gen2-rmk-peripheral.hex",
]
dependencies = ["firmware-dirs", "build"]

[tasks.objcopy-reset-central]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
dependencies = ["firmware-dirs", "install-llvm-tools", "flip-link", "flash-layout-config", "rmk-config-schema"]
script = '''
reset_keyboard_toml="$(mktemp "${TMPDIR:-/tmp}/lalapad-reset-keyboard.XXXXXX.toml")"
trap 'rm -f "$reset_keyboard_toml"' EXIT
python3 - "$reset_keyboard_toml" <<'PY'
import sys
from pathlib import Path

source = Path("keyboard.toml").read_text(encoding="utf-8").splitlines()
output = []
in_storage = False
inserted = False
found_storage = False
for line in source:
    stripped = line.strip()
    if stripped.startswith("[") and stripped.endswith("]"):
        if in_storage and not inserted:
            output.append("clear_storage = true")
            inserted = True
        in_storage = stripped == "[storage]"
        found_storage = found_storage or in_storage
    if in_storage and stripped.startswith("clear_storage"):
        if not inserted:
            output.append("clear_storage = true")
            inserted = True
        continue
    output.append(line)
if in_storage and not inserted:
    output.append("clear_storage = true")
if not found_storage:
    raise SystemExit("keyboard.toml must contain [storage] for reset firmware")
Path(sys.argv[1]).write_text("\n".join(output) + "\n", encoding="utf-8")
PY
KEYBOARD_TOML_PATH="$reset_keyboard_toml" \
cargo objcopy \
  --release \
  --bin \
  central \
  -- \
  -O \
  ihex \
  firmware/reset/lalapad-gen2-rmk-reset-central.hex
'''

