[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

[tasks.build]
command = "cargo"
args = ["build", "--release"]
dependencies = ["install-llvm-tools", "flip-link", "flash-layout-config", "rmk-config-schema"]

[tasks.flash-layout-config]
command = "python3"
args = ["tools/check_flash_layout.py", "--config-only"]

[tasks.rmk-config-schema]
script = '''
rmkit_version="$(rmkit --version 2>/dev/null || true)"
if [ "$rmkit_version" != "rmkit 0.0.21" ]; then
  cargo install --locked --force rmkit --version 0.0.21
fi
rmkit --version
rmkit get-chip --keyboard-toml-path keyboard.toml
rmkit get-project-name --keyboard-toml-path keyboard.toml
'''

[tasks.porting-coverage]
command = "python3"
args = [
    "tools/porting_coverage.py",
    "--coverage-baseline",
    "tools/porting_coverage_baseline.toml",
    "--require-zmk-source",
    "--require-zmk-source-commit",
    "--require-porting-complete",
]
dependencies = ["rmk-zmk-scenario-tests", "host-parity-tests", "rmk-behavior-tests"]

[tasks.host-parity-tests]
command = "cargo"
args = ["test", "--lib", "--target", "x86_64-unknown-linux-gnu"]
env = { RUSTFLAGS = "-Dwarnings" }

[tasks.rmk-behavior-tests]
env = { RUSTFLAGS = "-Dwarnings", RUST_TEST_THREADS = "1" }
script = '''
rmk_host_keyboard="$(mktemp "${TMPDIR:-/tmp}/lalapad-rmk-host-test.XXXXXX.toml")"
trap 'rm -f "$rmk_host_keyboard"' EXIT
printf '[rmk]\ncombo_max_num = 8\n' > "$rmk_host_keyboard"

KEYBOARD_TOML_PATH="$rmk_host_keyboard" \
cargo test \
  --manifest-path vendor/rmk-0.8.2/Cargo.toml \
  --target x86_64-unknown-linux-gnu \
  --tests \
  --no-default-features \
  --features "std host log" \
  -- --test-threads=1
'''

[tasks.rmk-zmk-scenario-tests]
dependencies = ["rmk-config-schema"]
env = { RUSTFLAGS = "-Dwarnings", RUST_TEST_THREADS = "1" }
script = '''
rmk_host_keyboard="$(mktemp "${TMPDIR:-/tmp}/lalapad-rmk-host-test.XXXXXX.toml")"
trap 'rm -f "$rmk_host_keyboard"' EXIT
printf '[rmk]\ncombo_max_num = 8\n' > "$rmk_host_keyboard"

KEYBOARD_TOML_PATH="$rmk_host_keyboard" \
cargo test \
  --manifest-path vendor/rmk-0.8.2/Cargo.toml \
  --target x86_64-unknown-linux-gnu \
  --test keyboard_lalapad_zmk_scenarios_test \
  --no-default-features \
  --features "std host log" \
  -- --test-threads=1
'''

[tasks.hardware-validation]
command = "python3"
args = [
    "tools/hardware_validation.py",
    "--hardware-baseline",
    "tools/hardware_validation_baseline.toml",
    "--require-classified",
]

[tasks.hardware-validation-report]
command = "python3"
args = ["tools/hardware_validation.py", "--markdown"]

[tasks.hardware-validation-evidence-template]
command = "python3"
args = ["tools/hardware_validation.py", "--evidence-template"]

[tasks.clean-current-git-ref]
script = '''
if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
  echo "working tree has tracked or untracked non-ignored changes; commit or stash them before deriving a current firmware ref" >&2
  exit 1
fi
'''

[tasks.hardware-validation-evidence-template-current]
dependencies = ["clean-current-git-ref"]
script = '''
if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
  echo "working tree has tracked or untracked non-ignored changes; commit or stash them, or pass --firmware-ref-template manually" >&2
  exit 1
fi

firmware_ref="$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short=12 HEAD)"
python3 tools/hardware_validation.py \
  --evidence-template \
  --firmware-ref-template "$firmware_ref"
'''

[tasks.hardware-validation-session-current]
dependencies = ["clean-current-git-ref", "firmware-artifact-manifest-current", "rmk-zmk-scenario-tests", "host-parity-tests", "rmk-behavior-tests"]
script = '''
if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
  echo "working tree has tracked or untracked non-ignored changes; commit or stash them before preparing current-ref hardware evidence" >&2
  exit 1
fi

firmware_ref="$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short=12 HEAD)"
artifact_pair_sha256="$(python3 - <<'PY'
import json
from pathlib import Path
print(json.loads(Path("firmware-artifacts.local.json").read_text())["pair_sha256"])
PY
)"
zmk_keymap="${ZMK_KEYMAP:-}"
if [ -z "$zmk_keymap" ]; then
  if [ -f ../zmk-config-LalaPadGen2/config/lalapadgen2.keymap ]; then
    zmk_keymap="../zmk-config-LalaPadGen2/config/lalapadgen2.keymap"
  elif [ -f zmk-config-LalaPadGen2/config/lalapadgen2.keymap ]; then
    zmk_keymap="zmk-config-LalaPadGen2/config/lalapadgen2.keymap"
  fi
fi

python3 tools/hardware_validation.py \
  --evidence-template \
  --firmware-ref-template "$firmware_ref" \
  --artifact-pair-sha256-template "$artifact_pair_sha256" \
  --firmware-artifact-manifest-template firmware-artifacts.local.json \
  > hardware-validation-evidence.local.toml

python3 tools/hardware_validation.py \
  --checklist \
  --firmware-ref-template "$firmware_ref" \
  --artifact-pair-sha256-template "$artifact_pair_sha256" \
  --firmware-artifact-manifest-template firmware-artifacts.local.json \
  > hardware-validation-checklist.local.md

set -- \
  tools/migration_status.py \
  --coverage-baseline tools/porting_coverage_baseline.toml \
  --hardware-baseline tools/hardware_validation_baseline.toml \
  --evidence hardware-validation-evidence.local.toml \
  --firmware-artifact-manifest firmware-artifacts.local.json \
  --require-zmk-source \
  --require-zmk-clean-source \
  --require-zmk-source-commit \
  --require-software-complete \
  --require-hardware-classified \
  --require-firmware-ref "$firmware_ref" \
  --markdown

if [ -n "$zmk_keymap" ]; then
  set -- "$@" --zmk-keymap "$zmk_keymap"
fi

python3 "$@" > migration-status.local.md
'''

[tasks.hardware-validation-checklist]
command = "python3"
args = ["tools/hardware_validation.py", "--checklist"]

[tasks.hardware-validation-hash-evidence]
script = '''
: "${HARDWARE_EVIDENCE:?set HARDWARE_EVIDENCE=path/to/evidence.toml}"
python3 tools/hardware_validation.py \
  --evidence "$HARDWARE_EVIDENCE" \
  --evidence-artifact-root "${EVIDENCE_ARTIFACT_ROOT:-.}" \
  --evidence-with-artifact-hashes
'''

[tasks.hardware-validation-finalize-evidence]
script = '''
set -e
: "${HARDWARE_EVIDENCE:?set HARDWARE_EVIDENCE=path/to/evidence.toml}"
: "${FIRMWARE_REF:?set FIRMWARE_REF=<tag-or-commit>}"
hashed_evidence="${HASHED_HARDWARE_EVIDENCE:-hardware-validation-evidence.hashed.local.toml}"
python3 - "$HARDWARE_EVIDENCE" "$hashed_evidence" <<'PY'
from pathlib import Path
import sys

source = Path(sys.argv[1]).resolve()
target = Path(sys.argv[2]).resolve()
if source == target:
    raise SystemExit("HASHED_HARDWARE_EVIDENCE must not overwrite HARDWARE_EVIDENCE")
PY
tmp_hashed_evidence="${hashed_evidence}.tmp.$$"
trap 'rm -f "$tmp_hashed_evidence"' EXIT

python3 tools/hardware_validation.py \
  --evidence "$HARDWARE_EVIDENCE" \
  --evidence-artifact-root "${EVIDENCE_ARTIFACT_ROOT:-.}" \
  --evidence-with-artifact-hashes \
  > "$tmp_hashed_evidence"
mv "$tmp_hashed_evidence" "$hashed_evidence"
trap - EXIT

HARDWARE_EVIDENCE="$hashed_evidence" \
FIRMWARE_REF="$FIRMWARE_REF" \
FIRMWARE_ARTIFACT_MANIFEST="${FIRMWARE_ARTIFACT_MANIFEST:-firmware-artifacts.local.json}" \
EVIDENCE_ARTIFACT_ROOT="${EVIDENCE_ARTIFACT_ROOT:-.}" \
cargo make migration-status-final
'''

