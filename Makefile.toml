[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

[tasks.build]
command = "cargo"
args = ["build", "--release"]
dependencies = ["install-llvm-tools", "flip-link", "flash-layout-config"]

[tasks.flash-layout-config]
command = "python3"
args = ["tools/check_flash_layout.py", "--config-only"]

[tasks.porting-coverage]
command = "python3"
args = [
    "tools/porting_coverage.py",
    "--coverage-baseline",
    "tools/porting_coverage_baseline.toml",
    "--require-zmk-source",
    "--require-porting-complete",
]

[tasks.hardware-validation]
command = "python3"
args = [
    "tools/hardware_validation.py",
    "--hardware-baseline",
    "tools/hardware_validation_baseline.toml",
    "--require-classified",
]

[tasks.hardware-validation-report]
command = "python3"
args = ["tools/hardware_validation.py", "--markdown"]

[tasks.hardware-validation-evidence-template]
command = "python3"
args = ["tools/hardware_validation.py", "--evidence-template"]

[tasks.migration-status]
command = "python3"
args = [
    "tools/migration_status.py",
    "--coverage-baseline",
    "tools/porting_coverage_baseline.toml",
    "--hardware-baseline",
    "tools/hardware_validation_baseline.toml",
    "--require-zmk-source",
    "--require-software-complete",
    "--require-hardware-classified",
]

[tasks.migration-status-final]
script = '''
: "${HARDWARE_EVIDENCE:?set HARDWARE_EVIDENCE=path/to/evidence.toml}"
: "${FIRMWARE_REF:?set FIRMWARE_REF=<tag-or-commit>}"
python3 tools/migration_status.py \
  --coverage-baseline tools/porting_coverage_baseline.toml \
  --hardware-baseline tools/hardware_validation_baseline.toml \
  --evidence "$HARDWARE_EVIDENCE" \
  --require-software-complete \
  --require-hardware-classified \
  --require-hardware-validated \
  --require-firmware-ref "$FIRMWARE_REF"
'''

[tasks.firmware-dirs]
command = "mkdir"
args = ["-p", "firmware/normal", "firmware/reset", "firmware/hex"]

[tasks.objcopy-central]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "central",
    "--",
    "-O",
    "ihex",
    "firmware/hex/lalapad-gen2-rmk-central.hex",
]
dependencies = ["firmware-dirs", "build"]

[tasks.objcopy-peripheral]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "peripheral",
    "--",
    "-O",
    "ihex",
    "firmware/hex/lalapad-gen2-rmk-peripheral.hex",
]
dependencies = ["firmware-dirs", "build"]

[tasks.uf2-central]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
    "hex-to-uf2",
    "--help",
] }
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "firmware/hex/lalapad-gen2-rmk-central.hex",
    "--output-path",
    "firmware/normal/lalapad-gen2-rmk-central.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-central"]

[tasks.uf2-peripheral]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
    "hex-to-uf2",
    "--help",
] }
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "firmware/hex/lalapad-gen2-rmk-peripheral.hex",
    "--output-path",
    "firmware/normal/lalapad-gen2-rmk-peripheral.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-peripheral"]

[tasks.flash-layout]
command = "python3"
args = ["tools/check_flash_layout.py", "--require-uf2"]
dependencies = ["uf2-central", "uf2-peripheral"]

[tasks.uf2]
dependencies = ["flash-layout"]
