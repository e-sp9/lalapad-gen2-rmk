[metadata]
target = "LaLaPad Gen2 RMK real-hardware validation"
description = "Machine-readable tracker for checks that cannot be proven by the static ZMK-to-RMK porting coverage gate."

[[checks]]
id = "iqs9151_right_i2c_identity"
area = "trackpad"
side = "right"
requirement = "Right IQS9151 answers at I2C address 0x56 and product-number register 0x1000 reads 0x09bc."
evidence = "Probe the right-half I2C bus or run diagnostic firmware that reports the product-number read."
evidence_artifacts = ["log"]
evidence_needles = ["right", "P0_04 SDA", "P0_05 SCL", "I2C activity", "0x56", "product-number register", "0x1000", "0x09bc"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#iqs9151-i2c-identity-check"
status = "requires_hardware"

[[checks]]
id = "iqs9151_left_i2c_identity"
area = "trackpad"
side = "left"
requirement = "Left IQS9151 answers at I2C address 0x56 and product-number register 0x1000 reads 0x09bc."
evidence = "Probe the left-half I2C bus or run diagnostic firmware that reports the product-number read."
evidence_artifacts = ["log"]
evidence_needles = ["left", "P0_04 SDA", "P0_05 SCL", "I2C activity", "0x56", "product-number register", "0x1000", "0x09bc"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#iqs9151-i2c-identity-check"
status = "requires_hardware"

[[checks]]
id = "iqs9151_right_rdy_signal"
area = "trackpad"
side = "right"
requirement = "Right RDY/IRQ on XIAO D6 / P1_11 idles high and pulses or drives low during sensor events."
evidence = "Measure the right-half RDY pin while touching the trackpad."
evidence_artifacts = ["scope"]
evidence_needles = ["right", "P1_11 RDY", "D6", "active-low", "no-touch high", "touch-event low"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#iqs9151-rdy-signal-check"
status = "requires_hardware"

[[checks]]
id = "iqs9151_left_rdy_signal"
area = "trackpad"
side = "left"
requirement = "Left RDY/IRQ on XIAO D6 / P1_11 idles high and pulses or drives low during sensor events."
evidence = "Measure the left-half RDY pin while touching the trackpad."
evidence_artifacts = ["scope"]
evidence_needles = ["left", "P1_11 RDY", "D6", "active-low", "no-touch high", "touch-event low"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#iqs9151-rdy-signal-check"
status = "requires_hardware"

[[checks]]
id = "right_trackpad_cursor_tap_scroll"
area = "trackpad"
side = "right"
requirement = "Right trackpad emits cursor motion, tap click, two-finger vertical scroll, and two-finger horizontal scroll without false cursor or click events during continuous scroll."
evidence = "Flash current central firmware, pair over BLE, and run the trackpad firmware baseline checklist on the right half."
evidence_artifacts = ["video"]
evidence_needles = ["right", "cursor", "tap", "vertical scroll", "horizontal scroll", "no cursor during scroll", "no right-click during scroll", "inertia continues", "inertia stops on touch"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#trackpad-cursor-tap-scroll-check"
status = "requires_hardware"

[[checks]]
id = "left_trackpad_split_cursor_tap_scroll"
area = "trackpad"
side = "left"
requirement = "Left trackpad emits cursor motion, tap click, two-finger vertical scroll, and two-finger horizontal scroll through the split custom-event path without false cursor or click events during continuous scroll."
evidence = "Flash current central and peripheral firmware, pair over BLE, and run the trackpad firmware baseline checklist on the left half."
evidence_artifacts = ["video"]
evidence_needles = ["left", "split", "cursor", "tap", "vertical scroll", "horizontal scroll", "no cursor during scroll", "no right-click during scroll", "inertia continues", "inertia stops on touch"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#trackpad-cursor-tap-scroll-check"
status = "requires_hardware"

[[checks]]
id = "trackpad_drag_cross_side"
area = "trackpad"
side = "both"
requirement = "Holding one trackpad for left-button hold while moving the other trackpad performs drag/select and releases when the held finger lifts."
evidence = "Run the cross-side drag check in both directions: right hold with left move and left hold with right move, confirming host drag/select and release."
evidence_artifacts = ["video"]
evidence_needles = ["cross-side drag", "right hold with left move", "left hold with right move", "left-button hold", "host drag/select", "release on held-finger lift", "no stuck button"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#cross-side-trackpad-drag-check"
status = "requires_hardware"

[[checks]]
id = "ble_split_pairing_reconnect"
area = "ble_split"
side = "both"
requirement = "Right central and left peripheral pair, reconnect, and preserve ordinary key input from both halves after host BLE re-pairing."
evidence = "Flash both halves, clear/re-pair the host BLE bond, reconnect right central first and left peripheral second, then verify left Q/A and right Y/H before and after reconnect."
evidence_artifacts = ["video", "BLE trace"]
evidence_needles = ["right central", "left peripheral", "BLE re-pair", "reconnect right first", "left Q", "left A", "right Y", "right H"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#ble-split-pairing-and-reconnect-check"
status = "requires_hardware"

[[checks]]
id = "vial_thumb_layer_taps"
area = "vial"
side = "both"
requirement = "Vial shows the thumb Space and Enter layer-tap positions, and the flashed firmware resolves Space+Y to layer-1 NumLock and Enter+Y to layer-2 PageUp."
evidence = "Open the flashed keyboard in Vial, inspect the thumb positions, then use a host key-event viewer to verify Space+Y emits NumLock and Enter+Y emits PageUp while the thumb key is held."
evidence_artifacts = ["Vial screenshot", "key-event log"]
evidence_needles = ["Vial", "Space", "Enter", "layer 1", "layer 2", "Space+Y", "NumLock", "Enter+Y", "PageUp"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#thumb-layer-tap-check"
status = "requires_hardware"

[[checks]]
id = "rgb_battery_connection_layer_indicators"
area = "status_led"
side = "right"
requirement = "The XIAO BLE RGB LED polarity and colors match battery, BLE/split connection, and central layer-change indications."
evidence = "Observe the right-half RGB LED through battery, connection, and layer-change states on real hardware."
evidence_artifacts = ["video"]
evidence_needles = ["right", "RGB", "P1_03 red", "P1_05 green", "P1_07 blue", "active-low", "battery 30 green after reset", "battery 20 yellow after reset", "battery 10 red critical blink", "BLE connected blue", "BLE advertising yellow", "BLE disconnected red", "split connected blue", "split disconnected red", "layer cyan"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#rgb-status-widget-check"
status = "requires_hardware"

[[checks]]
id = "charge_indicator_pins"
area = "battery"
side = "right"
requirement = "Charge-state input P0_17 active-low and charge LED output P0_10 active-low match the XIAO BLE board behavior."
evidence = "Connect USB/battery charge states and observe the charge input and LED behavior."
evidence_artifacts = ["photo", "multimeter"]
evidence_needles = ["right", "P0_17 charge-state", "active-low", "USB charging low", "not charging high", "P0_10 charge LED", "LED on low", "LED off high"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#charge-indicator-pin-check"
status = "requires_hardware"

[[checks]]
id = "storage_reset_and_reflash"
area = "storage"
side = "both"
requirement = "Storage clear/reset UF2 on both halves followed by normal firmware produces clean Vial/keymap behavior without stale host-side assumptions."
evidence = "Flash reset/storage-clear UF2 to the right and left halves, flash the matching normal central/peripheral UF2 files, re-pair BLE, and verify Vial/keymap behavior."
evidence_artifacts = ["video"]
evidence_needles = ["reset central UF2", "reset peripheral UF2", "normal central UF2", "normal peripheral UF2", "re-pair", "Vial"]
source = "docs/TRACKPAD_HARDWARE_CHECK.md#storage-reset-and-reflash-check"
status = "requires_hardware"
