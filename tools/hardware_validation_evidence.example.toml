# Copy this file to an untracked local evidence file after hardware testing.
# Then run:
#
#   python3 tools/hardware_validation.py --evidence path/to/evidence.toml --markdown
#   python3 tools/hardware_validation.py --evidence path/to/evidence.toml --require-validated
#   python3 tools/hardware_validation.py --evidence path/to/evidence.toml --require-firmware-ref <tag-or-commit>
# Generate a complete overlay with a pre-filled firmware ref:
#   python3 tools/hardware_validation.py --evidence-template --firmware-ref-template <tag-or-commit> > hardware-validation-evidence.local.toml
# Generate an artifact-bound overlay after creating firmware-artifacts.local.json:
#   python3 tools/hardware_validation.py --evidence-template --firmware-ref-template <tag-or-commit> --artifact-pair-sha256-template <sha256> > hardware-validation-evidence.local.toml
# The generated overlay includes a commented artifact_or_notes copy aid for
# each check. Keep the generated pair_sha256 prefix when present, then replace
# the path/reading placeholder with real bench evidence and leave every
# required observation term in the completed note. For final validation, also
# fill artifact_paths with real evidence files under the chosen
# EVIDENCE_ARTIFACT_ROOT, such as captured videos, logs, photos, screenshots, or
# scope traces.
#
# Evidence entries are overlays keyed by check id from
# tools/hardware_validation_manifest.toml. Keep the generated
# metadata.hardware_check_inventory_sha256 so the evidence is tied to the
# current check inventory. Keep artifact_or_notes specific: include a photo/log
# path, probe reading, or Vial observation note, include every required artifact
# listed by `evidence_artifacts`, and include every required observation listed
# by `evidence_needles` for that check. Set firmware_ref to the release tag,
# commit hash, or other immutable firmware identifier that was flashed during
# the hardware test. Do not use placeholders or moving refs such as
# main/latest/HEAD, and do not mark simulated, synthetic, mock, or host-only
# output as validated hardware evidence. validated_at must be a real YYYY-MM-DD
# date that is not in the future.

# [metadata]
# hardware_check_inventory_sha256 = "current tools/hardware_validation_manifest.toml inventory hash"

