# Copy this file to an untracked local evidence file after hardware testing.
# Then run:
#
#   python3 tools/hardware_validation.py --evidence path/to/evidence.toml --markdown
#   python3 tools/hardware_validation.py --evidence path/to/evidence.toml --require-validated
#   python3 tools/hardware_validation.py --evidence path/to/evidence.toml --require-firmware-ref <tag-or-commit>
# Generate a complete overlay with a pre-filled firmware ref:
#   python3 tools/hardware_validation.py --evidence-template --firmware-ref-template <tag-or-commit> > hardware-validation-evidence.local.toml
#
# Evidence entries are overlays keyed by check id from
# tools/hardware_validation_manifest.toml. Keep artifact_or_notes specific:
# include a photo/log path, probe reading, or Vial observation note, and include
# every required observation listed by `evidence_needles` for that check. Set
# firmware_ref to the release tag, commit hash, or other immutable firmware
# identifier that was flashed during the hardware test. Do not use placeholders
# or moving refs such as main/latest/HEAD. validated_at must be a real
# YYYY-MM-DD date that is not in the future.

