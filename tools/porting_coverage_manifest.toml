[metadata]
source = "ZMK LaLaPad Gen2 config/lalapadgen2.keymap"
source_repo_hint = "../zmk-config-LalaPadGen2"
description = "Machine-readable porting target for the RMK migration coverage gate. Expected values describe the RMK target behavior, including documented RMK-specific deltas needed to preserve the user's established thumb layer-tap workflow."

[source_inventory]
keymap_layers = [
  "DEFAULT_LAYER",
  "SECONDARY_LAYER",
  "TERTIARY_LAYER",
  "SYSTEM_LAYER",
]
behavior_nodes = [
  "zip_dyn_scale",
  "zip_dyn_scale_set",
  "mt2",
  "tap_dance_layer_1and2",
]
source_files = [
  "boards/shields/lalapadgen2/Kconfig.defconfig",
  "boards/shields/lalapadgen2/Kconfig.shield",
  "boards/shields/lalapadgen2/lalapadgen2-layouts.dtsi",
  "boards/shields/lalapadgen2/lalapadgen2.dtsi",
  "boards/shields/lalapadgen2/lalapadgen2_left.conf",
  "boards/shields/lalapadgen2/lalapadgen2_left.overlay",
  "boards/shields/lalapadgen2/lalapadgen2_right.conf",
  "boards/shields/lalapadgen2/lalapadgen2_right.overlay",
  "lalapadgen2.conf",
  "lalapadgen2.json",
  "lalapadgen2.keymap",
  "west.yml",
]
kconfig_files = [
  "lalapadgen2.conf",
  "boards/shields/lalapadgen2/lalapadgen2_left.conf",
  "boards/shields/lalapadgen2/lalapadgen2_right.conf",
]
dts_status_files = [
  { source_file = "boards/shields/lalapadgen2/lalapadgen2.dtsi", expected = ["trackpad_listener_R:disabled", "trackpad_listener_L:disabled", "leds:okay", "easy_charge_indicator:okay", "&xiao_i2c:okay", "iqs9151:okay"] },
  { source_file = "boards/shields/lalapadgen2/lalapadgen2_right.overlay", expected = ["&trackpad_listener_R:okay", "&trackpad_listener_L:okay"] },
  { source_file = "boards/shields/lalapadgen2/lalapadgen2_left.overlay", expected = ["&trackpad_split_L:okay", "&trackpad_split_R:disabled"] },
]
include_files = [
  { source_file = "lalapadgen2.keymap", expected = ["<input/processors.dtsi>", "<dt-bindings/zmk/zip_dynamic_scale.h>", "<behaviors.dtsi>", "<dt-bindings/zmk/bt.h>", "<dt-bindings/zmk/keys.h>", "<dt-bindings/zmk/outputs.h>", "<dt-bindings/zmk/pointing.h>"] },
  { source_file = "boards/shields/lalapadgen2/lalapadgen2.dtsi", expected = ["<dt-bindings/zmk/keys.h>", "<dt-bindings/zmk/matrix_transform.h>", "<dt-bindings/zmk/input_transform.h>", "<dt-bindings/zmk/zip_dynamic_scale.h>", "<zephyr/dt-bindings/input/input-event-codes.h>", "<input/processors.dtsi>", "\"lalapadgen2-layouts.dtsi\""] },
  { source_file = "boards/shields/lalapadgen2/lalapadgen2-layouts.dtsi", expected = ["<physical_layouts.dtsi>"] },
  { source_file = "boards/shields/lalapadgen2/lalapadgen2_right.overlay", expected = ["\"lalapadgen2.dtsi\""] },
  { source_file = "boards/shields/lalapadgen2/lalapadgen2_left.overlay", expected = ["\"lalapadgen2.dtsi\""] },
]
kconfig_entries = [
  { source_file = "boards/shields/lalapadgen2/Kconfig.defconfig", expected = ["ZMK_KEYBOARD_NAME:default \"LalapadGen2\"", "ZMK_SPLIT_ROLE_CENTRAL:default y", "ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS:default 1", "BT_MAX_CONN:default 5", "ZMK_SPLIT:default y"] },
  { source_file = "boards/shields/lalapadgen2/Kconfig.shield", expected = ["SHIELD_LALAPADGEN2_LEFT:def_bool $(shields_list_contains,lalapadgen2_left)", "SHIELD_LALAPADGEN2_RIGHT:def_bool $(shields_list_contains,lalapadgen2_right)"] },
]
west_manifest = [
  "remote:zmkfirmware:url-base=https://github.com/zmkfirmware",
  "remote:ShiniNet:url-base=https://github.com/ShiniNet/",
  "remote:caksoylar:url-base=https://github.com/caksoylar",
  "project:zmk:remote=zmkfirmware:revision=v0.3.0:import=app/west.yml",
  "project:zmk-driver-iqs9151:remote=ShiniNet:revision=main",
  "project:zmk-easy-charge-indicator:remote=ShiniNet:revision=main",
  "project:zmk-rgbled-widget:remote=caksoylar:revision=v0.3",
  "self:path=config",
]

[layout]
rows = 7
cols = 12
layers = 4

vial_custom_keycodes = [
  "BT0",
  "BT1",
  "BT2",
  "BT3",
  "NEXT_BT",
  "PREV_BT",
  "CLR_BT",
  "SWITCH",
  "CLR_PEER",
  "TP_XY_INC",
  "TP_XY_DEC",
  "TP_SC_INC",
  "TP_SC_DEC",
  "TP_SCALE_RST",
]

[[source_deltas]]
id = "delta_base_mo1_to_left_ctrl"
layer = 0
row = 3
col = 3
source_expected = "MO(1)"
target_expected = "LCtrl"
reason = "RMK target keeps the user's established left Ctrl position while Space carries the layer-tap."

[[source_deltas]]
id = "delta_base_space_to_layer_tap"
layer = 0
row = 3
col = 4
source_expected = "Space"
target_expected = "LT(1, Space, FAST_LAYER)"
reason = "RMK target preserves the established Space tap / layer-1 hold thumb behavior."

[[source_deltas]]
id = "delta_base_enter_to_layer_tap"
layer = 0
row = 3
col = 7
source_expected = "Enter"
target_expected = "LT(2, Enter, FAST_LAYER)"
reason = "RMK target preserves the established Enter tap / layer-2 hold thumb behavior."

