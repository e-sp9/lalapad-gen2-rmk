[metadata]
source = "ZMK LaLaPad Gen2 config/lalapadgen2.keymap"
source_repo_hint = "../zmk-config-LalaPadGen2"
description = "Machine-readable porting target for the RMK migration coverage gate. Expected values describe the RMK target behavior, including documented RMK-specific deltas needed to preserve the user's established thumb layer-tap workflow."

[layout]
rows = 7
cols = 12
layers = 4

[[source_deltas]]
id = "delta_base_mo1_to_left_ctrl"
layer = 0
row = 3
col = 3
source_expected = "MO(1)"
target_expected = "LCtrl"
reason = "RMK target keeps the user's established left Ctrl position while Space carries the layer-tap."

[[source_deltas]]
id = "delta_base_space_to_layer_tap"
layer = 0
row = 3
col = 4
source_expected = "Space"
target_expected = "LT(1, Space, FAST_LAYER)"
reason = "RMK target preserves the established Space tap / layer-1 hold thumb behavior."

[[source_deltas]]
id = "delta_base_enter_to_layer_tap"
layer = 0
row = 3
col = 7
source_expected = "Enter"
target_expected = "LT(2, Enter, FAST_LAYER)"
reason = "RMK target preserves the established Enter tap / layer-2 hold thumb behavior."

[[keymap_rows]]
id = "layer0_row0"
layer = 0
row = 0
source = "ZMK DEFAULT_LAYER row 0"
expected = ["Q", "W", "E", "R", "T", "No", "No", "Y", "U", "I", "O", "P"]

[[keymap_rows]]
id = "layer0_row1"
layer = 0
row = 1
source = "ZMK DEFAULT_LAYER row 1"
expected = ["A", "S", "D", "F", "G", "No", "No", "H", "J", "K", "L", "TH(Minus, Equal)"]

[[keymap_rows]]
id = "layer0_row2"
layer = 0
row = 2
source = "ZMK DEFAULT_LAYER row 2"
expected = ["MT(Z, LShift)", "X", "C", "V", "B", "No", "No", "N", "M", "Comma", "Dot", "Slash"]

[[keymap_rows]]
id = "layer0_row3"
layer = 0
row = 3
source = "ZMK DEFAULT_LAYER row 3, with RMK thumb layer-tap deltas"
expected = ["LCtrl", "LGui", "LAlt", "LCtrl", "LT(1, Space, FAST_LAYER)", "LShift", "Backspace", "LT(2, Enter, FAST_LAYER)", "MO(2)", "Language2", "Language1", "Backslash"]

[[keymap_rows]]
id = "layer0_row4"
layer = 0
row = 4
source = "ZMK DEFAULT_LAYER 5-way switches"
expected = ["No", "No", "Right", "Down", "Left", "Up", "Up", "Left", "Down", "Right", "No", "No"]

[[keymap_rows]]
id = "layer0_virtual_trackpad_buttons"
layer = 0
row = 5
source = "ZMK virtual pointing buttons"
expected = ["MouseBtn1", "MouseBtn2", "MouseBtn3", "No", "No", "No", "No", "No", "No", "MouseBtn1", "MouseBtn2", "MouseBtn3"]

[[keymap_rows]]
id = "layer0_virtual_trackpad_gestures"
layer = 0
row = 6
source = "ZMK virtual pointing gestures"
expected = ["MouseBtn4", "MouseBtn5", "WM(Tab, LGui)", "WM(D, LGui)", "LCtrl", "No", "No", "MouseBtn4", "MouseBtn5", "WM(Tab, LGui)", "WM(D, LGui)", "LCtrl"]

[[keymap_rows]]
id = "layer1_row0"
layer = 1
row = 0
source = "ZMK SECONDARY_LAYER row 0"
expected = ["Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "No", "No", "NumLock", "Kp7", "Kp8", "Kp9", "KpPlus"]

[[keymap_rows]]
id = "layer1_row1"
layer = 1
row = 1
source = "ZMK SECONDARY_LAYER row 1"
expected = ["Kc6", "Kc7", "Kc8", "Kc9", "Kc0", "No", "No", "_", "Kp4", "Kp5", "Kp6", "KpMinus"]

[[keymap_rows]]
id = "layer1_row2"
