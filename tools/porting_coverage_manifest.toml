id = "combo_escape"
actions = ["Q", "W"]
output = "Escape"
layer = 0
source = "ZMK CONBO_ESC key-positions <0 1>"

[[combos]]
id = "combo_tab"
actions = ["A", "S"]
output = "Tab"
layer = 0
source = "ZMK COMBO_TAB key-positions <10 11>"

[[combos]]
id = "combo_kana"
actions = ["J", "K"]
output = "Language1"
layer = 0
source = "RMK target delta: Kana combo mirrors the direct Language1 key positions even when the checked-out upstream ZMK source has not published COMBO_KANA."

[[combos]]
id = "combo_eisu"
actions = ["D", "F"]
output = "Language2"
layer = 0
source = "RMK target delta: Eisu combo mirrors the direct Language2 key positions even when the checked-out upstream ZMK source has not published COMBO_EUSU."

[[source_combo_deltas]]
id = "delta_combo_kana"
actions = ["J", "K"]
output = "Language1"
layer = 0
reason = "RMK preserves the user's established Kana combo as an explicit target-side delta when the canonical ZMK checkout only contains Escape and Tab combos."

[[source_combo_deltas]]
id = "delta_combo_eisu"
actions = ["D", "F"]
output = "Language2"
layer = 0
reason = "RMK preserves the user's established Eisu combo as an explicit target-side delta when the canonical ZMK checkout only contains Escape and Tab combos."

[[scenarios]]
id = "space_tap_is_space"
description = "Space thumb tap remains Space."
tap = { row = 3, col = 4 }
expected_output = "Space"

[[scenarios]]
id = "space_hold_y_selects_secondary_layer"
description = "Space thumb hold activates layer 1 for the Y position."
hold = { row = 3, col = 4, expected_action = "LT(1, Space, FAST_LAYER)", activates_layer = 1 }
tap = { row = 0, col = 7 }
expected_output = "NumLock"

[[scenarios]]
id = "space_hold_u_selects_keypad_7"
description = "Space thumb hold activates layer 1 for the U position."
hold = { row = 3, col = 4, expected_action = "LT(1, Space, FAST_LAYER)", activates_layer = 1 }
tap = { row = 0, col = 8 }
expected_output = "Kp7"

[[scenarios]]
id = "space_hold_j_selects_keypad_4"
description = "Space thumb hold activates layer 1 for the J position."
hold = { row = 3, col = 4, expected_action = "LT(1, Space, FAST_LAYER)", activates_layer = 1 }
tap = { row = 1, col = 8 }
expected_output = "Kp4"

[[scenarios]]
id = "space_hold_h_falls_back_to_base"
description = "Space thumb hold keeps transparent layer-1 H as the base H key."
hold = { row = 3, col = 4, expected_action = "LT(1, Space, FAST_LAYER)", activates_layer = 1 }
tap = { row = 1, col = 7 }
expected_output = "H"

[[scenarios]]
