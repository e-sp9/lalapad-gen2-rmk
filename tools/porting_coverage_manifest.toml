[metadata]
source = "ZMK LaLaPad Gen2 config/lalapadgen2.keymap"
source_repo_hint = "../zmk-config-LalaPadGen2"
description = "Machine-readable porting target for the RMK migration coverage gate. Expected values describe the RMK target behavior, including documented RMK-specific deltas needed to preserve the user's established thumb layer-tap workflow."

