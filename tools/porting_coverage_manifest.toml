[[combos]]
id = "combo_escape"
actions = ["Q", "W"]
output = "Escape"
layer = 0
source = "ZMK CONBO_ESC key-positions <0 1>"

[[combos]]
id = "combo_tab"
actions = ["A", "S"]
output = "Tab"
layer = 0
source = "ZMK COMBO_TAB key-positions <10 11>"

[[combos]]
id = "combo_kana"
actions = ["J", "K"]
output = "Language1"
layer = 0
source = "ZMK COMBO_KANA key-positions <16 17>"

[[combos]]
id = "combo_eisu"
actions = ["D", "F"]
output = "Language2"
layer = 0
source = "ZMK COMBO_EUSU key-positions <12 13>"

[[scenarios]]
id = "space_tap_is_space"
description = "Space thumb tap remains Space."
tap = { row = 3, col = 4 }
expected_output = "Space"

[[scenarios]]
id = "space_hold_y_selects_secondary_layer"
description = "Space thumb hold activates layer 1 for the Y position."
hold = { row = 3, col = 4, expected_action = "LT(1, Space, FAST_LAYER)", activates_layer = 1 }
tap = { row = 0, col = 7 }
expected_output = "NumLock"

[[scenarios]]
id = "enter_tap_is_enter"
description = "Enter thumb tap remains Enter."
tap = { row = 3, col = 7 }
expected_output = "Enter"

[[scenarios]]
id = "enter_hold_y_selects_tertiary_layer"
description = "Enter thumb hold activates layer 2 for the Y position."
hold = { row = 3, col = 7, expected_action = "LT(2, Enter, FAST_LAYER)", activates_layer = 2 }
tap = { row = 0, col = 7 }
expected_output = "PageUp"

[[scenarios]]
id = "space_enter_hold_y_selects_system_layer"
description = "Holding both thumb layer-taps activates the system tri-layer."
holds = [
  { row = 3, col = 4, expected_action = "LT(1, Space, FAST_LAYER)", activates_layer = 1 },
  { row = 3, col = 7, expected_action = "LT(2, Enter, FAST_LAYER)", activates_layer = 2 },
]
tap = { row = 0, col = 7 }
expected_output = "User7"
