name: Build firmware

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'memory.x'
      - 'build.rs'
      - 'keyboard.toml'
      - 'vial.json'
      - 'Makefile.toml'
      - 'vendor/rmk-0.8.2/**'
      - 'tools/check_flash_layout.py'
      - 'tools/hardware_validation.py'
      - 'tools/hardware_validation_baseline.toml'
      - 'tools/hardware_validation_evidence.example.toml'
      - 'tools/hardware_validation_manifest.toml'
      - 'tools/firmware_artifact_manifest.py'
      - 'tools/migration_status.py'
      - 'tools/porting_coverage.py'
      - 'tools/porting_coverage_baseline.toml'
      - 'tools/porting_coverage_manifest.toml'
      - 'README.md'
      - 'docs/PORTING.md'
      - 'docs/RELEASE.md'
      - 'docs/TRACKPAD_HARDWARE_CHECK.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/auto-tag.yml'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write
  # Pages デプロイを自動再実行するために workflow_dispatch を呼ぶ。
  actions: write

jobs:
  build:
    name: Build uf2 + DFU zips
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # rmk-types のマクロ展開で rustc のデフォルトスレッドスタック (8MB)
      # を使い切り SIGSEGV するため 16MB に拡張する。
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout upstream ZMK config
        uses: actions/checkout@v4
        with:
          repository: e-sp9/zmk-config-LalaPadGen2
          path: zmk-config-LalaPadGen2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src,rustfmt,llvm-tools
          targets: thumbv7em-none-eabihf

      - name: Install libclang (for bindgen in nrf-sdc-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo registry, installed binaries and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/firmware.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo build tools
        run: |
          command -v flip-link          >/dev/null || cargo install --locked flip-link
          command -v cargo-objcopy      >/dev/null || cargo install --locked cargo-binutils
          command -v cargo-hex-to-uf2   >/dev/null || cargo install --locked cargo-hex-to-uf2
          command -v cargo-make         >/dev/null || cargo install --locked cargo-make

      - name: Verify RMK config and flash layout
        run: |
          python3 -m json.tool vial.json >/tmp/lalapad-vial-check.json
          python3 -c 'import tomllib; [tomllib.load(open(path, "rb")) for path in ("keyboard.toml", "Cargo.toml", "Makefile.toml", "tools/porting_coverage_manifest.toml", "tools/porting_coverage_baseline.toml", "tools/hardware_validation_manifest.toml", "tools/hardware_validation_baseline.toml", "tools/hardware_validation_evidence.example.toml")]; print("toml ok")'
          python3 tools/check_flash_layout.py --config-only
          python3 tools/hardware_validation.py --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 tools/hardware_validation.py \
            --hardware-baseline tools/hardware_validation_baseline.toml \
            --require-classified

      - name: Verify ZMK-to-RMK porting coverage
        run: |
          cargo make porting-coverage
          python3 tools/migration_status.py \
            --coverage-baseline tools/porting_coverage_baseline.toml \
            --hardware-baseline tools/hardware_validation_baseline.toml \
            --zmk-keymap zmk-config-LalaPadGen2/config/lalapadgen2.keymap \
            --require-zmk-source \
            --require-software-complete \
            --require-hardware-classified \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Run host parity tests
        run: cargo test --lib --target x86_64-unknown-linux-gnu

      - name: Run RMK behavior regression tests
        run: cargo make rmk-behavior-tests

      - name: Build release binaries (central + peripheral)
        run: cargo make build

      - name: Generate hex + uf2 for both halves
        run: cargo make uf2

      - name: Install adafruit-nrfutil
        run: pip install --upgrade adafruit-nrfutil

      # Generate DFU zip packages for serial DFU flashing via the Adafruit UF2
      # bootloader. These packages are consumed by the web flasher
      # (tools/web-flasher) as well as the `adafruit-nrfutil dfu serial` CLI.
      - name: Generate DFU zip packages
        run: |
          set -eu
          adafruit-nrfutil dfu genpkg \
            --dev-type 0x0052 \
            --application firmware/hex/lalapad-gen2-rmk-central.hex \
            firmware/lalapad-gen2-rmk-central-dfu.zip
          adafruit-nrfutil dfu genpkg \
            --dev-type 0x0052 \
            --application firmware/hex/lalapad-gen2-rmk-peripheral.hex \
            firmware/lalapad-gen2-rmk-peripheral-dfu.zip

      - name: Show artifact sizes
        run: |
          ls -la \
            firmware/normal/lalapad-gen2-rmk-central.uf2 \
            firmware/normal/lalapad-gen2-rmk-peripheral.uf2 \
            firmware/hex/lalapad-gen2-rmk-central.hex \
            firmware/hex/lalapad-gen2-rmk-peripheral.hex \
            firmware/lalapad-gen2-rmk-central-dfu.zip \
            firmware/lalapad-gen2-rmk-peripheral-dfu.zip

      - name: Generate firmware artifact manifest
        run: |
          python3 tools/firmware_artifact_manifest.py \
            --require-uf2 \
            --require-dfu \
            --firmware-ref "${GITHUB_REF_NAME:-$GITHUB_SHA}" \
            > firmware/lalapad-gen2-rmk-artifacts.json

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lalapad-gen2-rmk-firmware
          path: |
            firmware/normal/lalapad-gen2-rmk-central.uf2
            firmware/normal/lalapad-gen2-rmk-peripheral.uf2
            firmware/hex/lalapad-gen2-rmk-central.hex
            firmware/hex/lalapad-gen2-rmk-peripheral.hex
            firmware/lalapad-gen2-rmk-central-dfu.zip
            firmware/lalapad-gen2-rmk-peripheral-dfu.zip
            firmware/lalapad-gen2-rmk-artifacts.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/normal/lalapad-gen2-rmk-central.uf2
            firmware/normal/lalapad-gen2-rmk-peripheral.uf2
            firmware/hex/lalapad-gen2-rmk-central.hex
            firmware/hex/lalapad-gen2-rmk-peripheral.hex
            firmware/lalapad-gen2-rmk-central-dfu.zip
            firmware/lalapad-gen2-rmk-peripheral-dfu.zip
            firmware/lalapad-gen2-rmk-artifacts.json
          generate_release_notes: true
          fail_on_unmatched_files: true

      # GITHUB_TOKEN で作成した Release は `release: published` イベントを
      # 発火させない (cascading workflow trigger 抑止) ため、Pages 再デプロイを
      # 明示的に dispatch して flasher へ最新ファームを取り込ませる。
      - name: Trigger Pages redeploy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
