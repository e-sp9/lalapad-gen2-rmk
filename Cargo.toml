[package]
name = "lalapad-gen2-rmk"
version = "0.1.0"
authors = ["e-sp9"]
description = "RMK firmware for LaLaPad Gen2"
homepage = "https://github.com/ShiniNet/LaLaPadGen2"
repository = "https://github.com/e-sp9/lalapad-gen2-rmk"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embedded-hal-async = "1.0"
embedded-hal = "1.0"
usbd-hid = "0.9"
# RMK's proc macros inspect top-level dependencies in Cargo.toml for feature
# gates; the actual firmware dependency remains target-scoped below.
rmk = { version = "0.8", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "controller",
    "adafruit_bl",
    "passkey_entry",
], optional = true }

[target.'cfg(target_arch = "arm")'.dependencies]
rmk = { version = "0.8", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "controller",
    "adafruit_bl",
    "passkey_entry",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "11d5c3c", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.6", default-features = false, features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-nrf = { version = "0.8", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.9", features = [
    "defmt",
    "arch-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

rand = { version = "0.8.4", default-features = false }
rand_core = { version = "0.6" }
rand_chacha = { version = "0.3", default-features = false }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[patch.crates-io]
rmk = { path = "vendor/rmk-0.8.2" }

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
